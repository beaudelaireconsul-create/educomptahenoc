<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px;max-width:640px;margin:auto}
h1{font-size:20px;margin:0}.mu{color:var(--mu);font-size:12px}
.top{display:flex;justify-content:space-between;align-items:center}
nav{display:flex;gap:6px;margin:12px 0}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:13px}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}

.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font-size:15px;font-weight:600}
.btn.s{width:auto;padding:7px 12px;font-size:13px}.btn.l{background:none;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ac)}
.lg p{font-size:13px;line-height:1.5;margin:8px 0}.lg h3{font-size:14px;margin:14px 0 2px}.late{color:var(--rd)}.err{color:var(--rd);font-size:13px}

<h3>4. Paiements</h3><p>Les paiements en ligne sont traités par un prestataire tiers (FedaPay). EduCompta ne conserve ni les identifiants Mobile Money ni les données de carte. Un paiement est enregistré lorsque le prestataire le confirme. Des frais du prestataire peuvent s'appliquer. Les questions de scolarité et de remboursement relèvent de l'école.</p>

<h3>10. Contact et droit applicable</h3><p>Exploitant : [VOTRE NOM OU SOCIÉTÉ]. Contact : [VOTRE EMAIL]. Droit applicable : [VOTRE PAYS].</p>`},privacy:{t:"Politique de confidentialité",b:`<p class="mu">Version pilote · octobre 2026</p>

<h3>Données collectées</h3><p><b>École :</b> nom, pays, email du directeur, mot de passe (stocké sous forme chiffrée irréversible). <b>Élèves :</b> nom, classe, frais, historique des paiements, téléphone du parent, code d'accès. <b>Paiements :</b> montant, date, moyen, statut, référence de transaction. <b>Technique :</b> adresse IP, pour limiter les tentatives d'accès frauduleuses.</p>
<h3>Pourquoi</h3><p>Suivre les frais de scolarité, permettre aux parents de consulter leur solde et de payer, et sécuriser le service.</p>

<h3>Mineurs</h3><p>Les données d'élèves mineurs sont saisies par l'école et utilisées uniquement pour la gestion de la scolarité.</p>`}},en:{terms:{t:"Terms of use",b:`<p class="mu">Pilot version · October 2026</p>

<h3>4. Payments</h3><p>Online payments are processed by a third-party provider (FedaPay). EduCompta stores neither Mobile Money credentials nor card data. A payment is recorded once the provider confirms it. Provider fees may apply. Tuition and refund matters are the school's responsibility.</p>

const t=k=>D[lang][k]||k;
const fmt=(n,c)=>{try{return new Intl.NumberFormat(lang==='fr'?'fr-FR':'en-GB',{style:'currency',currency:c||'XOF',maximumFractionDigits:0}).format(n)}catch(e){return n+' '+c}};

const opts=sel=>C.map(c=>`<option value="${c.code}" ${c.code===sel?'selected':''}>${esc(c.name)} (+${c.dial})</option>`).join('');
async function api(p,o={}){
  const r=await fetch(API+'/api'+p,{...o,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:o.body&&JSON.stringify(o.body)});
  const d=r.status===204?{}:await r.json().catch(()=>({}));
  if(r.status===401&&tok){logout();return{}}
  if(!r.ok)throw new Error(d.error||'Erreur');return d}
function setLang(){lang=lang==='fr'?'en':'fr';localStorage.setItem('lang',lang);document.documentElement.lang=lang;render()}
function logout(){localStorage.removeItem('tok');tok=null;me=null;tab='login';render()}
function setTab(x){tab=x;msg='';note='';render()}
function share(id){const e=ST.find(x=>x.id===id);if(!e)return;location.href='https://wa.me/?text='+encodeURIComponent(t('wamsg')+' - '+e.name+'\n'+t('code')+': '+e.access_code+'\n'+location.origin)}
function copyCode(id){const e=ST.find(x=>x.id===id);if(e&&navigator.clipboard)navigator.clipboard.writeText(e.access_code).then(()=>{msg=t('copied');render()})}
async function render(){
  document.getElementById('lg').textContent=lang==='fr'?'EN':'FR';
  document.getElementById('sub').textContent=(me?me.school+' · '+me.currency:t('sub'));
  document.getElementById('ft').innerHTML=`<a href="#" onclick="setTab('terms');return false">${t('terms')}</a> · <a href="#" onclick="setTab('privacy');return false">${t('privacy')}</a>`;
  const N=document.getElementById('nav'),A=document.getElementById('app');
  N.innerHTML=tok?[['dash','home'],['eleves','students'],['pay','payment']].map(([a,b])=>`<button class="${tab===a?'on':''}" onclick="setTab('${a}')">${t(b)}</button>`).join('')+`<button onclick="logout()">${t('quit')}</button>`:'';
  try{
  if(tok&&!me)me=await api('/me');
  document.getElementById('sub').textContent=(me?me.school+' · '+me.currency:t('sub'));
  if(tab==='terms'||tab==='privacy'){const p=LEGAL[lang][tab];A.innerHTML=`<div class="card lg"><b>${p.t}</b>${p.b}<br><button class="btn l" onclick="setTab(tok?'dash':'login')">${t('back')}</button></div>`;return}
  if(tab==='login'||tab==='register'){const reg=tab==='register';
    A.innerHTML=`<div class="card"><b>${reg?t('reg'):t('login')}</b><br>${reg?`<label>${t('school')}</label><input id="sc"><label>${t('country')}</label><select id="co">${opts('BJ')}</select>`:''}<label>${t('email')}</label><input id="em" type="email"><label>${t('pwd')}</label><input id="pw" type="password"><div class="err">${esc(msg)}</div><button class="btn" onclick="auth(${reg})">${reg?t('create'):t('signin')}</button><br><br><button class="btn l" onclick="setTab('${reg?'login':'register'}')">${reg?t('have'):t('regbtn')}</button><br><br><button class="btn l" onclick="setTab('parent')">👨‍👩‍👧 ${t('parent')}</button></div>`;return}
  if(tab==='dash'){const d=await api('/dashboard'),s=await api('/students'),imp=s.filter(e=>e.paid<e.total_fee),c=me.currency;
    A.innerHTML=`<div class="grid"><div class="card"><div class="mu">${t('collected')}</div><div class="big">${fmt(d.paid,c)}</div></div><div class="card"><div class="mu">${t('left')}</div><div class="big late">${fmt(d.remaining,c)}</div></div></div><div class="card"><div class="mu">${t('recovery')}</div><div class="big">${d.rate}%</div><div class="bar"><i style="width:${d.rate}%"></i></div></div><div class="card"><b>${t('unpaid')} (${imp.length})</b>${imp.map(e=>`<div class="row"><div>${esc(e.name)}<div class="mu">${esc(e.class)} · +${esc(e.parent_phone)}</div></div><b class="late">${fmt(e.total_fee-e.paid,c)}</b></div>`).join('')||`<p class="mu">${t('none')}</p>`}</div>`}
  if(tab==='eleves'){const s=await api('/students'),c=me.currency;ST=s;
    A.innerHTML=`<div class="card"><b>${t('add_s')}</b><br><label>${t('name')}</label><input id="n"><label>${t('cls')}</label><input id="c"><label>${t('pphone')} (+${me.dial})</label><input id="t" type="tel"><label>${t('fee')} (${c})</label><input id="m" type="number" inputmode="numeric"><div class="err">${esc(msg)}</div><div class="mu" style="color:var(--ac);font-size:14px">${esc(note)}</div><button class="btn" onclick="addS()">${t('add')}</button></div><div class="card"><b>${t('students')} (${s.length})</b>${s.map(e=>`<div class="row"><div>${esc(e.name)}<div class="mu">${esc(e.class)} · ${fmt(e.paid,c)} / ${fmt(e.total_fee,c)}</div><div class="mu">${t('code')} : <b>${esc(e.access_code)}</b> · <a href="#" onclick="copyCode(${e.id});return false">${t('copy')}</a> · <a href="#" onclick="share(${e.id});return false">${t('wa')}</a></div></div><button class="btn s" style="background:var(--rd)" onclick="delS(${e.id})">✕</button></div>`).join('')}</div>`}

  if(tab==='parent'){
    let h=`<div class="card"><b>👨‍👩‍👧 ${t('pspace')}</b><p class="mu">${t('phint')}</p><label>${t('country')}</label><select id="pc">${opts(PCC)}</select><input id="pt" type="tel" value="${esc(PT)}"><label>${t('code')}</label><input id="pk" value="${esc(PK)}" placeholder="K7M2XP" autocapitalize="characters"><div class="mu" style="margin:-6px 0 10px">${t('codehint')}</div><button class="btn" onclick="PCC=v('pc');localStorage.setItem('pcc',PCC);PT=v('pt');PK=v('pk');msg='';render()">${t('see')}</button>${tok?'':`<br><br><button class="btn l" onclick="setTab('login')">${t('back')}</button>`}</div>`;
    if(PT&&PK){const s=await api('/parent/students?phone='+encodeURIComponent(PT)+'&cc='+PCC+'&code='+encodeURIComponent(PK));if(!s.length)h+=`<div class="card mu">${t('nf')}</div>`;
    s.forEach(e=>{const r=e.total_fee-e.paid;h+=`<div class="card"><b>${esc(e.name)}</b> <span class="mu">${esc(e.class)}</span><div class="bar"><i style="width:${e.total_fee?e.paid/e.total_fee*100:0}%"></i></div><div class="row"><span class="mu">${t('paid')}</span><b>${fmt(e.paid,e.currency)}</b></div><div class="row"><span class="mu">${t('rest')}</span><b class="${r?'late':''}">${fmt(r,e.currency)}</b></div>${r<=0?`<p>${t('solved')}</p>`:e.online?`<label>${t('amount')} (${e.currency})</label><input id="pa${e.id}" type="number" value="${r}"><button class="btn" onclick="parentPay(${e.id})">${t('payb')}</button>`:`<p class="mu">${t('soon')}</p>`}</div>`})}
    h+=`<div class="err">${esc(msg)}</div>`;A.innerHTML=h}
  }catch(e){msg=e.message;A.innerHTML=`<div class="card err">${esc(e.message)}</div>`}}
async function auth(reg){try{const b={email:v('em'),password:v('pw')};if(reg){b.school=v('sc');b.country=v('co')}
  const d=await api('/auth/'+(reg?'register':'login'),{method:'POST',body:b});tok=d.token;localStorage.setItem('tok',tok);me=null;tab='dash';msg='';render()}catch(e){msg=e.message;render()}}
async function addS(){try{const d=await api('/students',{method:'POST',body:{name:v('n'),class:v('c'),parent_phone:v('t'),total_fee:+v('m')}});msg='';note=t('newcode')+' '+d.access_code;render()}catch(e){msg=e.message;render()}}
async function delS(id){if(confirm(t('del'))){await api('/students/'+id,{method:'DELETE'});render()}}
async function payM(){try{await api('/payments',{method:'POST',body:{student_id:+v('e'),amount:+v('a'),method:v('md')}});msg='';setTab('dash')}catch(e){msg=e.message;render()}}
async function parentPay(id){try{const d=await api('/parent/pay',{method:'POST',body:{
